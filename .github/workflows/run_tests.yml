name: Run Tests

on:
  push:
    branches: [ master ]
  pull_request:
    # Include PRs targeting other stack branches, and rerun after retargeting
    # or marking a draft ready so review requests use a fresh result.
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Test review automation
      run: node --test .github/scripts/request-review.test.cjs
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Prepare core development dependencies
      run: python -m pip install -r base_requirements.txt
    - name: Check source import
      run: python -c "import pathlib, pyqsp; print(pyqsp.__file__); assert pathlib.Path(pyqsp.__file__).resolve() == pathlib.Path('pyqsp/__init__.py').resolve()"
    - name: Lint with flake8
      run: |
        make lint
        python -m flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: make test
    - name: Build distributions
      run: make build
    - name: Check installed wheel outside checkout
      run: |
        python -m installer dist/*.whl
        cd "$(mktemp -d)"
        python -c "import os, pathlib, pyqsp; print(pyqsp.__file__); assert not pathlib.Path(pyqsp.__file__).resolve().is_relative_to(pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve())"
        python -c "import pyqsp.LPoly, pyqsp.completion, pyqsp.decomposition, pyqsp.angle_sequence, pyqsp.response, pyqsp.main"
        pyqsp --help
        pyqsp --poly=.2,0,.1 --method laurent --output-json poly2angles
