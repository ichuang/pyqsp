name: Run Tests

on:
  push:
    branches: [ master ]
  pull_request:
    # Include PRs targeting other stack branches, and rerun after retargeting
    # or marking a draft ready so review requests use a fresh result.
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Test review automation
      run: node --test .github/scripts/request-review.test.cjs
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Prepare core development dependencies
      run: python -m pip install -r base_requirements.txt flake8
    - name: Check source import
      run: python -c "import pathlib, pyqsp; print(pyqsp.__file__); assert pathlib.Path(pyqsp.__file__).resolve() == pathlib.Path('pyqsp/__init__.py').resolve()"
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        python -m flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: python -m pytest pyqsp/test
